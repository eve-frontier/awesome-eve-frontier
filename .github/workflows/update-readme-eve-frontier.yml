name: Update README with "eve frontier" repositories

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # каждый день в 03:00 UTC

permissions:
  contents: write

jobs:
  build-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate README.md from GitHub search
        env:
          GH_TOKEN: ${{ github.token }}
          QUERY: eve frontier
          PER_PAGE: 100
          MAX_PAGES: 10
        run: |
          set -euo pipefail

          TMP_JSON="repos.jsonl"
          : > "$TMP_JSON"

          for page in $(seq 1 "$MAX_PAGES"); do
            echo "Fetching page $page"

            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/search/repositories?q=$(printf '%s' "$QUERY" | sed 's/ /+/g')&sort=stars&order=desc&per_page=$PER_PAGE&page=$page" \
              > "page.json"

            items_count="$(jq '.items | length' page.json)"

            if [ "$items_count" -eq 0 ]; then
              echo "No more results on page $page"
              break
            fi

            jq -c '.items[]' page.json >> "$TMP_JSON"
          done

          jq -s '
            unique_by(.full_name)
            | sort_by(-.stargazers_count)
          ' "$TMP_JSON" > all_repos.json

          UPDATED_AT="$(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          TOTAL="$(jq 'length' all_repos.json)"

          {
            echo "# EVE Frontier repositories"
            echo
            echo "GitHub search query: \`$QUERY\`"
            echo
            echo "Updated: $UPDATED_AT"
            echo
            echo "Total repositories collected: **$TOTAL**"
            echo
            echo "## Repository list"
            echo
            echo "| # | Repository | Stars | Language | Updated | Description |"
            echo "|---:|---|---:|---|---|---|"

            jq -r '
              to_entries[]
              | [
                  (.key + 1),
                  .value.full_name,
                  .value.html_url,
                  .value.stargazers_count,
                  (.value.language // "-"),
                  (.value.updated_at // "-"),
                  ((.value.description // "-") | gsub("\\r|\\n"; " ") | gsub("\\|"; "\\\\|"))
                ]
              | @tsv
            ' all_repos.json | while IFS=$'\t' read -r idx full_name html_url stars language updated_at description; do
              echo "| $idx | [$full_name]($html_url) | $stars | $language | $updated_at | $description |"
            done
          } > README.md

      - name: Commit and push if changed
        run: |
          set -euo pipefail

          if git diff --quiet README.md; then
            echo "No changes in README.md"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "Update README with GitHub search results for eve frontier"
          git push
