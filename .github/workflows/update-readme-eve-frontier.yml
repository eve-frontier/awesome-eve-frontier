name: Update README with EVE Frontier repositories

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  build-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate README.md from GitHub search
        env:
          GH_TOKEN: ${{ github.token }}
          QUERY: eve frontier
          PER_PAGE: 100
          MAX_PAGES: 10
        run: |
          set -euo pipefail

          TMP_JSON="repos.jsonl"
          : > "$TMP_JSON"

          for page in $(seq 1 "$MAX_PAGES"); do
            echo "Fetching page $page"

            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/search/repositories?q=$(printf '%s' "$QUERY" | sed 's/ /+/g')&sort=stars&order=desc&per_page=$PER_PAGE&page=$page" \
              > "page.json"

            items_count="$(jq '.items | length' page.json)"

            if [ "$items_count" -eq 0 ]; then
              echo "No more results on page $page"
              break
            fi

            jq -c '.items[]' page.json >> "$TMP_JSON"
          done

          jq -s '
            unique_by(.full_name)
            | sort_by(-.stargazers_count)
          ' "$TMP_JSON" > all_repos.json

          UPDATED_AT="$(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          TOTAL="$(jq 'length' all_repos.json)"

          {
            echo "# Awesome EVE Frontier Project on Github"
            echo
            echo "<small><em>Updated: $UPDATED_AT</em></small>"
            echo
            echo "---"
            echo
            echo "Total projects collected: **$TOTAL**"
            echo

            jq -r '
              group_by(.language // "Unknown")
              | sort_by(.[0].language // "Unknown")
              | .[]
              | (.[0].language // "Unknown")
            ' all_repos.json | while IFS= read -r language; do
              echo "## $language"
              echo
              echo "| # | Repository | ⭐ | 🔄️ | Description |"
              echo "|---:|---|---:|---|---|"

              jq -r --arg lang "$language" '
                map(select((.language // "Unknown") == $lang))
                | sort_by(-.stargazers_count)
                | to_entries[]
                | [
                    (.key + 1),
                    .value.full_name,
                    .value.html_url,
                    .value.stargazers_count,
                    (.value.updated_at // "-"),
                    (
                      (.value.description // "-")
                      | gsub("\\r|\\n"; " ")
                      | gsub("\\|"; "\\\\|")
                      | if length > 200 then .[0:200] + "..." else . end
                    )
                  ]
                | @tsv
              ' all_repos.json | while IFS=$'\t' read -r idx full_name html_url stars updated_at description; do

                if [ "$updated_at" != "-" ]; then
                  updated_ts=$(date -d "$updated_at" +%s)
                  now_ts=$(date +%s)
                  days=$(( (now_ts - updated_ts) / 86400 ))
                  updated_str="`${days}d ago`"
                else
                  updated_str="-"
                fi

                echo "| $idx | [$full_name]($html_url) | $stars | $updated_str | $description |"
              done

              echo
            done
          } > README.md

      - name: Commit and push if changed
        run: |
          set -euo pipefail

          if git diff --quiet README.md; then
            echo "No changes in README.md"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "Update README with EVE Frontier repositories"
          git push
